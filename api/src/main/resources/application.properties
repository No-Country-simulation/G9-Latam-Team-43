spring.application.name=tecnoteca-api
server.port=${PUERTO_API:8080}

# URL del servicio de modelo (equipo de ciencia de datos)
tecnoteca.modelo.url=${MODELO_URL:http://localhost:8001}
# CSV con contenidos iniciales para poblar la base de conocimiento
tecnoteca.semilla.ruta=${SEMILLA_RUTA:data/semilla_kb.csv}

# Persistencia: H2 en archivo (sin servidor externo)
spring.datasource.url=jdbc:h2:file:${BD_RUTA:./data/tecnoteca-db}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.org.hibernate=warn

# JSON en snake_case (titulo, informacion_adicional, palabras_clave, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Carga de CSV por lotes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cliente HTTP hacia el servicio de modelo
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=60s

# Documentación interactiva
springdoc.swagger-ui.path=/swagger-ui.html
